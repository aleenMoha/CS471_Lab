<!DOCTYPE html>
<html>
<head>
    <title>Lab 9 - Task 3</title>
</head>
<body>
    <h1>Task 3: Oldest Book for Each Publisher</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Publisher</th>
            <th>Location</th>
            <th>Oldest Book Date</th>
        </tr>

        {% for publisher in publishers %}
        <tr>
            <td>{{ publisher.name }}</td>
            <td>{{ publisher.location }}</td>
            <td>
                {% if publisher.oldest_book_date %}
                    {{ publisher.oldest_book_date }}
                {% else %}
                    No books
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
