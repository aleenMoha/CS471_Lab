<!DOCTYPE html>
<html>
<head>
    <title>Books Using Forms</title>
</head>
<body>

<h1>Books List - Django Forms</h1>

<a href="{% url 'form_addbook' %}">Add New Book</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.price }}</td>
        <td>
            <a href="{% url 'form_editbook' book.id %}">Edit</a>
            <a href="{% url 'form_deletebook' book.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
